# Gewassendatabase met vuistregels voor Nederland (laatste nachtvorst ± half mei).
# Pas gerust aan. Je kunt ook in tuin.yaml onder `gewassen:` gewassen toevoegen
# of losse velden overschrijven (bijv. een ander venster voor jouw ras).
#
# Velden per gewas:
#   naam, emoji
#   familie        sleutel uit `families` hieronder (voor vruchtwisseling en kleur)
#   methode        zaaien      = direct buiten zaaien
#                  voorzaaien  = binnen of onder glas zaaien, later uitplanten
#                  poten       = pootgoed, plantuitjes, teentjes
#                  planten     = je koopt/plant een plantje
#   venster        periode voor de eerste handeling, [MM-DD, MM-DD], of een lijst
#                  van zulke periodes als er meerdere zijn (voorjaar en najaar)
#   uitplanten_na  (alleen voorzaaien) weken tussen zaaien en uitplanten
#   rij, plant     rijafstand en afstand in de rij, in cm
#   breedwerpig    true = breed uitstrooien, geen plantaantal (zaad_g_m2 = gram per m²)
#   uitdunnen      true = taak "uitdunnen" 3 weken na zaaien
#   oogst_na       dagen vanaf "in de grond" (zaaien, uitplanten of poten) tot de eerste oogst
#   oogst_duur     weken dat je kunt oogsten
#   oogst_label    andere tekst dan "eerste oogst" (bijv. voor groenbemesters)
#   opbrengst      bijv. "3 kg/m2", "2 kg/plant", "1 stuks/plant", "4 bos/m2"
#   plantgoed_naam hoe het pootgoed heet (bij poten)
#   taken          extra taken: {weken: n, wat: ...} relatief aan "in de grond"
#                  (negatief = ervoor), of {datum: MM-DD, wat: ...}
#   vast           true = vaste plant (fruit): elk jaar oogst, geen zaai- of plantklus
#   oogst          (alleen vast) oogstperiode [MM-DD, MM-DD]; taken met datum gelden elk jaar
#   tip            korte tip

families:
  kool:        { naam: Koolachtigen }
  nachtschade: { naam: Nachtschade }
  peul:        { naam: Vlinderbloemigen }
  wortel:      { naam: Schermbloemigen }
  komkommer:   { naam: Komkommerachtigen }
  blad:        { naam: Blad en biet }
  ui:          { naam: Uien }
  bloemen:     { naam: Bloemen }
  overig:      { naam: Overig }

gewassen:

  # ---------- nachtschade ----------
  aardappel:
    naam: Aardappel
    emoji: 🥔
    familie: nachtschade
    methode: poten
    venster: [04-01, 04-30]
    rij: 60
    plant: 35
    oogst_na: 90
    oogst_duur: 4
    opbrengst: 3 kg/m2
    plantgoed_naam: pootaardappels
    taken:
      - { weken: 4, wat: aanaarden }
      - { weken: 7, wat: nogmaals aanaarden }
    tip: Vroege rassen kun je eind juni rooien; daarna is er plek voor een nateelt.

  tomaat:
    naam: Tomaat
    emoji: 🍅
    familie: nachtschade
    methode: voorzaaien
    venster: [03-15, 04-15]
    uitplanten_na: 9
    rij: 60
    plant: 50
    oogst_na: 70
    oogst_duur: 10
    opbrengst: 2 kg/plant
    taken:
      - { weken: 1, wat: opbinden en voortaan wekelijks dieven }
      - { datum: 08-10, wat: toppen (top boven de laatste bloemtros eruit) }
    tip: Buiten liefst tegen een zonnige muur of onder een afdakje, tegen phytophthora.

  paprika:
    naam: Paprika
    emoji: 🫑
    familie: nachtschade
    methode: voorzaaien
    venster: [02-15, 03-31]
    uitplanten_na: 12
    rij: 50
    plant: 50
    oogst_na: 80
    oogst_duur: 8
    opbrengst: 1 kg/plant
    tip: Doet het buiten matig; beter in een kas of tunnel.

